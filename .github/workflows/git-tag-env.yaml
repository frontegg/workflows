# used by stateops to support individual env deployment
name: Git tag ENV
concurrency: ${{ inputs.environment }}
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        default: staging
      runner:
        required: false
        type: string
        default: ubuntu-latest
env:
  ENV_NAME: ${{ inputs.environment }}
jobs:
  git-tag-env:
    environment: ${{ inputs.environment }}
    # Production tags are always moved from GitHub-hosted runners, whatever the caller asks for.
    runs-on: ${{ startsWith(inputs.environment, 'production') && 'ubuntu-latest' || inputs.runner }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Tag ENV
        run: |
          echo tagging $ENV_NAME
          timestamp=$(date +'%Y%m%d.%H%M%S')
          audit_tag=$ENV_NAME-$timestamp
          actual_tag=$ENV_NAME
          git tag $audit_tag --force && git push origin refs/tags/$audit_tag --force
          git tag $actual_tag --force && git push origin refs/tags/$actual_tag --force