name: Full Suite Test (API + E2E On Venv)
on:
  workflow_call:
    inputs:
      build_image:
        type: boolean
        required: false
        description: This has no effect on this workflow any more, should be remoeved when all services will remove it
        default: false
      tests_tag:
        type: string
        required: false
        description: Set the e2e-api tests branch tag
        default: master
      ref:
        type: string
        required: false
        description: Set the venv branch
        default: ''
      react_version:
        type: string
        required: false
        description: Set the react version
      dispatch_id:
        type: string
        required: false
        description: Dispatch id to update status (repo/sha)
    secrets:
      GH_REPOSITORY_ADMIN_TOKEN:
        description: 'Github repository admin token'
        required: true
      DEV_ARGOCD_PASSWORD:
        description: 'ArgoCD password'
        required: true
      NPM_TOKEN:
        description: 'Npm token'
        required: true
      DOCKER_HUB_ACTION_USER:
        description: 'Docker hub user'
        required: true
      DOCKER_HUB_ACTION_PASSWORD:
        description: 'Docker hub password'
        required: true
      MAILOSAUR_API_KEY:
        description: 'MAILOSAUR API KEY'
        required: true
      MAILOSAUR_SERVER_ID:
        description: 'MAILOSAUR SERVER ID'
        required: true
      MAILOSAUR_SERVER_DOMAIN:
        description: 'MAILOSAUR SERVER DOMAIN'
        required: true
      ZEPHYR_TOKEN:
        description: ''
        required: true
      AZURE_APP_CLIENT_ID:
        description: ''
        required: true
      AZURE_APP_SECRET:
        description: ''
        required: true
      GH_FRONTEGG_BOT_APP_ID:
        description: 'Frontegg Bot Creds'
        required: true
      GH_FRONTEGG_BOT_APP_SECRET:
        description: 'Frontegg Bot Creds'
        required: true
      DD_API_KEY:
        description: 'Datadog API Key'
        required: true
env:
  BUCKET_NAME: "frontegg-test-reports"
  AWS_REGION: "us-east-1"

permissions:
  id-token: write
  contents: read
  issues: read
  checks: write
  statuses: write
  pull-requests: write
  
jobs:
  # Fail fast on PRs that are behind the base branch so we don't spin up a
  # venv / run e2e that will need to be re-run after an update anyway.
  # Skipped for merge_group / workflow_dispatch / other non-PR callers.
  check-up-to-date:
    name: Check PR is up to date with base
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fail if behind base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          if ! git merge-base --is-ancestor "origin/$BASE_REF" HEAD; then
            echo "::error::PR branch is behind '$BASE_REF'. Update the branch, then re-run e2e."
            git --no-pager log --oneline "HEAD..origin/$BASE_REF" | head -20
            exit 1
          fi
          echo "PR is up to date with origin/$BASE_REF"

  start-venv:
    name: Start venv
    needs: [ check-up-to-date ]
    if: |
      always() &&
      !cancelled() &&
      (needs.check-up-to-date.result == 'success' || needs.check-up-to-date.result == 'skipped')
    uses: frontegg/workflows/.github/workflows/start-venv.yaml@master
    with:
      volatileEnvironment: true
      triggerSlack: false
      ref: ${{ inputs.ref }}
    secrets: inherit

  prepare-params:
    name: Prepare environment params
    runs-on: ubuntu-latest
    needs: [ start-venv ]
    outputs:
      apiUrl: ${{ steps.variables.outputs.apiUrl }}
      portalUrl: ${{ steps.variables.outputs.portalUrl }}
      environmentId: ${{ steps.variables.outputs.environmentId }}
    steps:
      - name: prepare output params
        id: variables
        run: |
          echo "environmentId=${{ needs.start-venv.outputs.environmentId }}" >> $GITHUB_OUTPUT
          echo "apiUrl=${{ needs.start-venv.outputs.apiUrl }}" >> $GITHUB_OUTPUT
          echo "portalUrl=${{ needs.start-venv.outputs.portalUrl }}" >> $GITHUB_OUTPUT
      - id: create_bot_token
        name: Create bot token
        if: ${{ inputs.dispatch_id }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_FRONTEGG_BOT_APP_ID }}
          private-key: ${{ secrets.GH_FRONTEGG_BOT_APP_SECRET }}
          owner: ${{ github.repository_owner }}
      - name: "Update trigger status"
        uses: frontegg/workflows/.github/shared-actions/update-status@master
        if: ${{ inputs.dispatch_id }}
        with:
          token: ${{ steps.create_bot_token.outputs.token }}
          dispatch_id: ${{ inputs.dispatch_id }}
          description: 'Start tests environment ${{ steps.variables.outputs.apiUrl }}'

  # Re-check once after venv is ready so we don't start e2e/API if master
  # moved during venv startup. Running shards are not cancelled mid-flight.
  recheck-up-to-date:
    name: Recheck PR is still up to date
    runs-on: ubuntu-latest
    needs: [ prepare-params ]
    if: |
      always() &&
      !cancelled() &&
      github.event_name == 'pull_request' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fail if behind base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          if ! git merge-base --is-ancestor "origin/$BASE_REF" HEAD; then
            echo "::error::PR fell behind '$BASE_REF' during the run. Update the branch and re-run."
            git --no-pager log --oneline "HEAD..origin/$BASE_REF" | head -20
            exit 1
          fi
          echo "PR is still up to date with origin/$BASE_REF"

  run-e2e-test:
    name: Run E2E Tests on Venv
    needs: [ prepare-params, recheck-up-to-date ]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: frontegg/e2e-system-tests/.github/workflows/execute-test-command.yaml@master
    with:
      server_url: ${{ needs.prepare-params.outputs.apiUrl }}
      portal_url: ${{ needs.prepare-params.outputs.portalUrl }}
      tests_tag: ${{ inputs.tests_tag }}
      command: |
        FRAMEWORK="react" yarn run test:e2e:sanity --shard=${{ matrix.shard }}/${{ matrix.total }}
      workflowName: "E2E Tests on Venv"
      runs_on: ubuntu-latest-4-cores
    strategy:
      fail-fast: false
      matrix:
        total: [ 3 ]
        shard: [ 1,2,3]
    secrets: inherit

  run-api-test:
    name: Run API Tests on Venv
    needs: [ prepare-params, recheck-up-to-date ]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: frontegg/e2e-system-tests/.github/workflows/execute-test-command.yaml@master
    with:
      server_url: ${{ needs.prepare-params.outputs.apiUrl }}
      portal_url: ${{ needs.prepare-params.outputs.portalUrl }}
      tests_tag: ${{ inputs.tests_tag }}
      command: |
        yarn test:api --shard=${{ matrix.shard }}/${{ matrix.total }}
      workflowName: "API Tests on Venv"
    strategy:
      fail-fast: false
      matrix:
        total: [ 3 ]
        shard: [ 1,2,3 ]
    secrets: inherit

  update-trigger-status:
    name: Update trigger status
    runs-on: ubuntu-latest
    needs: [ check-up-to-date, recheck-up-to-date, run-api-test, run-e2e-test, start-venv, prepare-params ]
    if: ${{ always() && inputs.dispatch_id }}
    steps:
      - id: create_bot_token
        name: Create bot token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_FRONTEGG_BOT_APP_ID }}
          private-key: ${{ secrets.GH_FRONTEGG_BOT_APP_SECRET }}
          owner: ${{ github.repository_owner }}
      - name: "trigger failure status"
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        uses: frontegg/workflows/.github/shared-actions/update-status@master
        with:
          token: ${{ steps.create_bot_token.outputs.token }}
          dispatch_id: ${{ inputs.dispatch_id }}
          state: "failure"
          description: 'Failed | Api Tests: ${{ needs.run-api-test.result }} | E2E Tests: ${{ needs.run-e2e-test.result }}'
      - name: "trigger success status"
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        uses: frontegg/workflows/.github/shared-actions/update-status@master
        with:
          token: ${{ steps.create_bot_token.outputs.token }}
          dispatch_id: ${{ inputs.dispatch_id }}
          state: "success"
          description: 'E2E tests passed'

  remove-venv:
    name: Remove venv
    needs: [ run-api-test, run-e2e-test, start-venv, prepare-params ]
    if: |
      always() &&
      (needs.prepare-params.outputs.environmentId) &&
      !contains(needs.run-api-test.result, 'failure') &&
      !contains(needs.run-e2e-test.result, 'failure')
    uses: frontegg/workflows/.github/workflows/remove-single-venv.yaml@master
    with:
      venvId: ${{ needs.prepare-params.outputs.environmentId }}
      gracePeriodInMinutes: "${{ (needs.start-venv.result == 'failure') && '15' || '0' }}"
    secrets:
      admin_github_token: ${{ secrets.GH_REPOSITORY_ADMIN_TOKEN }}
